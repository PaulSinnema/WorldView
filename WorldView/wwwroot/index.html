    <script>
        // Auto-update + recovery from stale cached HTML (GitHub Pages caches ~10 min)
        (function () {
            const KEY = 'wv-recover';
            function reloadFresh(param, value) {
                const url = new URL(location.href);
                url.searchParams.set(param, value);
                location.replace(url.toString());
            }
            function recover() {
                const n = parseInt(sessionStorage.getItem(KEY) || '0', 10);
                if (n >= 2) return;
                sessionStorage.setItem(KEY, String(n + 1));
                reloadFresh('r', Date.now());
            }
            window.wvRecover = recover;
            const watchdog = setTimeout(recover, 90000);
            let current = null;
            async function check() {
                if (!current) return;
                try {
                    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.version && data.version !== current) reloadFresh('v', data.version);
                } catch { }
            }
            window.wvScrollTo = id => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); // help page index
        window.wvUpdater = {
                start(version) {
                    current = version;
                    clearTimeout(watchdog);
                    sessionStorage.removeItem(KEY);
                    check();
                    setInterval(check, 60000);
                    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
                    window.addEventListener('focus', check);
                }
            };
        })();
    </script>

<body>
    <div id="app"><div class="boot">WORLDVIEW · …</div></div>
    <div id="blazor-error-ui">

    <script>
        // Lightbox zoom/pan: wheel or pinch zooms around the pointer, drag pans, double-click resets
        (function () {
            const st = new WeakMap();
            const get = el => st.get(el) ?? (st.set(el, { s: 1, x: 0, y: 0 }), st.get(el));
            const apply = (el, z) => {
                z.s = Math.min(12, Math.max(1, z.s));
                if (z.s === 1) { z.x = 0; z.y = 0; }
                el.style.transform = `translate(${z.x}px, ${z.y}px) scale(${z.s})`;
            };
            // Zoom by factor around a screen point (cx, cy)
            const zoomAt = (el, f, cx, cy) => {
                const z = get(el), r = el.getBoundingClientRect();
                const ox = r.left - z.x, oy = r.top - z.y; // untransformed origin
                const px = (cx - ox - z.x) / z.s, py = (cy - oy - z.y) / z.s;
                z.s *= f;
                z.s = Math.min(12, Math.max(1, z.s));
                z.x = cx - ox - px * z.s; z.y = cy - oy - py * z.s;
                apply(el, z);
            };
            const media = () => document.querySelector('.lightbox .lb-media');

            document.addEventListener('wheel', e => {
                const el = e.target.closest?.('.lb-media');
                if (!el) return;
                e.preventDefault();
                zoomAt(el, Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
            }, { passive: false });

            document.addEventListener('dblclick', e => {
                const el = e.target.closest?.('.lb-media');
                if (!el) return;
                const z = get(el);
                if (z.s > 1) { z.s = 1; apply(el, z); } else zoomAt(el, 3, e.clientX, e.clientY);
            });

            document.addEventListener('click', e => {
                const b = e.target.closest?.('[data-zoom]'), el = media();
                if (!b || !el) return;
                const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                if (b.dataset.zoom === 'reset') { const z = get(el); z.s = 1; apply(el, z); }
                else zoomAt(el, b.dataset.zoom === 'in' ? 1.5 : 1 / 1.5, cx, cy);
            });

            // Drag (1 pointer) and pinch (2 pointers)
            const ptrs = new Map();
            let last = null;
            document.addEventListener('pointerdown', e => {
                const el = e.target.closest?.('.lb-media');
                if (!el) return;
                el.setPointerCapture(e.pointerId);
                ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
                last = null;
                el.classList.add('dragging');
            });
            document.addEventListener('pointermove', e => {
                const el = media();
                if (!el || !ptrs.has(e.pointerId)) return;
                const prev = ptrs.get(e.pointerId);
                ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
                const z = get(el);
                if (ptrs.size === 1) {
                    if (z.s === 1) return;
                    z.x += e.clientX - prev.x; z.y += e.clientY - prev.y;
                    apply(el, z);
                } else if (ptrs.size === 2) {
                    const [a, b] = [...ptrs.values()];
                    const d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (last) zoomAt(el, d / last, (a.x + b.x) / 2, (a.y + b.y) / 2);
                    last = d;
                }
            });
            const up = e => {
                ptrs.delete(e.pointerId);
                last = null;
                if (!ptrs.size) media()?.classList.remove('dragging');
            };
            document.addEventListener('pointerup', up);
            document.addEventListener('pointercancel', up);
        })();
    </script>
    <script>
        // Error bar in the saved/browser language (before Blazor starts)
        (function () {
            const T = { en: ['An error occurred.', 'Reload'], nl: ['Er is een fout opgetreden.', 'Herladen'], de: ['Ein Fehler ist aufgetreten.', 'Neu laden'], fr: ['Une erreur s’est produite.', 'Recharger'], zh: ['发生错误。', '重新加载'] };
            let l = null;
            try { l = JSON.parse(localStorage.getItem('wv-settings') || '{}').lang; } catch { }
            l = l || (navigator.language || 'en').slice(0, 2);
            const s = T[l] || T.en;
            document.documentElement.lang = T[l] ? l : 'en';
            document.getElementById('err-text').textContent = s[0];
            document.getElementById('err-reload').textContent = s[1];
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" onerror="wvRecover()"></script>
