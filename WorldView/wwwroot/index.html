<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>WorldView</title>
    <base href="/" />
    <link rel="icon" href="data:," />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" />
    <script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/';</script>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
    <style>
        :root { --fg: #c8ffe6; --acc: #3fd0ff; --ok: #7dffb0; --warn: #ffb020; --bg: rgba(4, 12, 16, .78); --line: rgba(125, 255, 176, .28); }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg); font-family: "Share Tech Mono", ui-monospace, monospace; font-size: 13px; }
        #app { height: 100%; }
        button, input, select { font: inherit; color: inherit; }
        .globe { position: fixed; inset: 0; }
        .globe .cesium-viewer-bottom { left: calc(6px + env(safe-area-inset-left)); bottom: calc(4px + env(safe-area-inset-bottom)); }
        .detect { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; }
        .version { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); z-index: 40; font-size: 12px; color: var(--ok); text-shadow: 0 0 6px #000, 0 0 2px #000; }
        .hud { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); z-index: 10; line-height: 1.55; color: var(--ok); text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
        .hud-title { font-size: 16px; letter-spacing: 2px; color: #fff; }
        .hud-title span { color: var(--ok); font-size: 12px; }
        .hud-target { color: var(--warn); }
        .crosshair { position: fixed; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; z-index: 6; pointer-events: none; border: 1px solid rgba(125,255,176,.55); border-radius: 50%; }
        .crosshair::before, .crosshair::after { content: ""; position: absolute; background: rgba(125,255,176,.7); }
        .crosshair::before { left: 50%; top: -10px; bottom: -10px; width: 1px; }
        .crosshair::after { top: 50%; left: -10px; right: -10px; height: 1px; }
        .topbar { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 6px; width: min(460px, calc(100% - 24px)); }
        .search { flex: 1; display: flex; background: var(--bg); border: 1px solid var(--line); }
        .search input { flex: 1; min-width: 0; padding: 7px 10px; background: transparent; border: 0; outline: none; }
        .topbar button { padding: 0 11px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; }
        .search button { border: 0; border-left: 1px solid var(--line); background: transparent; }
        .mic.on { background: rgba(255, 60, 60, .55); }
        .panel { position: fixed; top: calc(32px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); z-index: 20; width: 250px; max-height: calc(100% - 90px); overflow-y: auto; padding: 4px 12px 12px; background: var(--bg); border: 1px solid var(--line); }
        .panel.toggled { display: none; }
        .panel h3 { margin: 12px 0 6px; font-size: 11px; font-weight: normal; letter-spacing: 2px; color: var(--acc); }
        .layer-row { display: flex; align-items: center; gap: 6px; }
        .layer { flex: 1; display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
        .layer-row .zoom { width: 24px; height: 22px; padding: 0; background: none; border: 1px solid transparent; opacity: .35; cursor: pointer; }
        .layer-row .zoom.active { opacity: 1; color: var(--ok); border-color: var(--line); }
        .layer .dot { width: 8px; height: 8px; border-radius: 50%; }
        .layer .name { flex: 1; }
        .layer .count { color: var(--ok); }
        .layer-status { margin: -1px 0 3px 22px; font-size: 11px; opacity: .65; }
        .styles, .toggles, .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .styles button, .toggles button, .actions button, .info-actions button, .powerup button { padding: 5px 6px; background: rgba(255,255,255,.04); border: 1px solid var(--line); cursor: pointer; text-align: left; }
        .styles b { color: var(--acc); font-weight: normal; }
        button.active { background: rgba(125,255,176,.22); border-color: var(--ok); }
        .actions { margin-top: 8px; }
        .slider { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .slider input { flex: 1; min-width: 0; accent-color: var(--ok); }
        .slider span:last-child { width: 36px; text-align: right; }
        .panel select { width: 100%; padding: 5px; background: #061218; border: 1px solid var(--line); }
        .powerup { display: flex; flex-wrap: wrap; gap: 4px; }
        .powerup input { flex: 1; min-width: 0; padding: 5px; background: #061218; border: 1px solid var(--line); }
        .hint, .keys { font-size: 11px; opacity: .6; margin-top: 6px; line-height: 1.4; }
        .info { position: fixed; left: calc(12px + env(safe-area-inset-left)); bottom: calc(44px + env(safe-area-inset-bottom)); z-index: 20; width: min(330px, calc(100% - 24px)); max-height: 60%; overflow-y: auto; background: var(--bg); border: 1px solid var(--ok); }
        .info header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; background: rgba(125,255,176,.14); color: #fff; }
        .info .x { background: none; border: 0; cursor: pointer; }
        .info img, .info video { display: block; width: 100%; background: #000; }
        .info { resize: horizontal; min-width: 240px; max-width: calc(100% - 24px); }
        .info .media { cursor: zoom-in; }
        .lightbox { position: fixed; inset: 0; z-index: 45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,.88); cursor: zoom-out; }
        .lightbox img, .lightbox video { width: min(95vw, calc(85vh * 16 / 9)); height: auto; max-height: 85vh; object-fit: contain; border: 1px solid var(--ok); background: #000; }
        .lb-cap { font-size: 12px; opacity: .8; }
        .info table { width: 100%; border-collapse: collapse; margin: 4px 0; }
        .info th { text-align: left; font-weight: normal; color: var(--acc); padding: 2px 10px; vertical-align: top; white-space: nowrap; }
        .info td { padding: 2px 10px 2px 0; word-break: break-word; }
        .info-actions { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 10px 10px; }
        .contacts { list-style: none; margin: 0; padding: 0 10px 10px; }
        .contacts li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-top: 1px solid var(--line); cursor: pointer; }
        .contacts li:hover { color: #fff; }
        .tuner { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 7px 12px; width: min(560px, calc(100% - 24px)); box-sizing: border-box; background: var(--bg); border: 1px solid #ff4fd8; }
        .tuner input { flex: 1; accent-color: #ff4fd8; }
        .tuner .station { width: 34%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .toast { position: fixed; left: 50%; top: calc(52px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 30; max-width: calc(100% - 40px); padding: 7px 14px; background: var(--bg); border: 1px solid var(--acc); }
        .boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #000; color: var(--ok); letter-spacing: 3px; text-align: center; padding: 20px; }
        .boot.error { color: #ff6b6b; letter-spacing: 0; }
        @media (max-width: 760px) {
            .panel { display: none; top: calc(48px + env(safe-area-inset-top)); right: 12px; left: 12px; width: auto; }
            .panel.toggled { display: block; }
            .hud { top: calc(48px + env(safe-area-inset-top)); font-size: 11px; }
            .hud-title { font-size: 13px; }
            .topbar { left: 12px; transform: none; width: calc(100% - 110px); }
            .tuner .station { display: none; }
        }
        #blazor-error-ui { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 8px 12px; background: #b32121; color: #fff; }
        #blazor-error-ui .dismiss { float: right; cursor: pointer; }
    </style>
    <script type="importmap"></script>
    <script>
        // Auto-update + recovery from stale cached HTML (GitHub Pages caches ~10 min)
        (function () {
            const KEY = 'wv-recover';
            function reloadFresh(param, value) {
                const url = new URL(location.href);
                url.searchParams.set(param, value);
                location.replace(url.toString());
            }
            function recover() {
                const n = parseInt(sessionStorage.getItem(KEY) || '0', 10);
                if (n >= 2) return;
                sessionStorage.setItem(KEY, String(n + 1));
                reloadFresh('r', Date.now());
            }
            window.wvRecover = recover;
            const watchdog = setTimeout(recover, 90000);
            let current = null;
            async function check() {
                if (!current) return;
                try {
                    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.version && data.version !== current) reloadFresh('v', data.version);
                } catch { }
            }
            window.wvUpdater = {
                start(version) {
                    current = version;
                    clearTimeout(watchdog);
                    sessionStorage.removeItem(KEY);
                    check();
                    setInterval(check, 60000);
                    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
                    window.addEventListener('focus', check);
                }
            };
        })();
    </script>
</head>
<body>
    <div id="app"><div class="boot">WORLDVIEW · LADEN…</div></div>
    <div id="blazor-error-ui">
        Er is een fout opgetreden. <a href="." class="reload">Herladen</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" onerror="wvRecover()"></script>
</body>
</html>
