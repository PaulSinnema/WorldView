name = "worldview-fetcher"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "FEED"
bucket_name = "worldview-data"

[vars]
# Seconds between OpenSky global snapshots (4 credits each; 120 s = 2880 of 4000 credits/day)
OPENSKY_INTERVAL_S = "120"

# Secrets (not in this file): npx wrangler secret put OPENSKY_CLIENT_ID / OPENSKY_CLIENT_SECRET
