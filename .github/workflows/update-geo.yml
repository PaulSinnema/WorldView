name: Update geo data

# Monthly refresh of borders, provinces, cities, time zones, coastlines and sea borders; redeploys when anything changed
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Every fetch retried up to 20 times (tools/retry-fetch.mjs: network errors, timeouts, 429, 5xx);
      # a script that still fails (e.g. a download cut off halfway) runs again, at most 3 times.
      # A source that stays down only skips its own files: the others are still updated (warning in the run summary)
      - name: Build borders, provinces and cities
        env:
          NODE_OPTIONS: --import ./tools/retry-fetch.mjs
          FETCH_RETRIES: 20
        run: |
          run() {
            for i in 1 2 3; do
              node "$@" && return 0
              echo "::warning::$* failed (attempt $i/3)"
              sleep 30
            done
            echo "::error::$* gave up after 3 attempts, its data stays as it was"
            echo "- \`$*\` failed, data not updated" >> "$GITHUB_STEP_SUMMARY"
            return 0
          }
          run tools/build-geo.mjs
          run tools/build-tz.mjs
          run tools/build-sea.mjs
          run tools/build-nature.mjs
          run --max-old-space-size=6000 tools/build-coast.mjs
          run --max-old-space-size=6000 tools/build-borders.mjs

      - name: Commit when changed
        id: commit
        run: |
          git add WorldView/wwwroot/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update geo data ($(date -u +%Y-%m))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes by GITHUB_TOKEN don't trigger other workflows: start the deploy explicitly
      - name: Redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
